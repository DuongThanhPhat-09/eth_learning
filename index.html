<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Học Ethereum</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="readbar" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar-inner">
    <button class="icon-btn only-mobile" id="menuBtn" aria-label="Mở mục lục" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="#home">
      <svg class="brand-mark" viewBox="0 0 24 38" aria-hidden="true"><path d="M12 0 0 19.4 12 26.5l12-7.1z" fill="currentColor" opacity=".9"/><path d="m12 28.8-12-7.1L12 38l12-16.3z" fill="currentColor" opacity=".55"/></svg>
      <span>Học Ethereum</span>
    </a>
    <nav class="topnav" aria-label="Chính">
      <a href="#home" data-nav="home">Lộ trình</a>
      <a href="#glossary" data-nav="glossary">Thuật ngữ</a>
      <a href="#flashcards" data-nav="flashcards">Flashcard</a>
      <a href="#review" data-nav="review">Ôn tập</a>
    </nav>
    <button class="search-trigger" id="searchBtn" aria-label="Tìm kiếm">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="hide-sm">Tìm bài, thuật ngữ…</span>
      <kbd class="hide-sm">/</kbd>
    </button>
    <button class="icon-btn" id="themeBtn" aria-label="Đổi giao diện sáng/tối">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/></svg>
    </button>
  </div>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Mục lục khóa học"></aside>
  <div class="scrim" id="scrim" hidden></div>
  <main id="main" tabindex="-1"></main>
</div>

<div class="search-overlay" id="searchOverlay" hidden>
  <div class="search-panel" role="dialog" aria-modal="true" aria-label="Tìm kiếm">
    <div class="search-head">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="searchInput" type="search" placeholder="Ví dụ: gas, rollup, ERC-20, staking…" autocomplete="off">
      <button class="esc" id="searchClose">Esc</button>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<script src="js/data/01-basics.js"></script>
<script src="js/data/02-using.js"></script>
<script src="js/data/03-use-cases.js"></script>
<script src="js/data/04-staking-nodes.js"></script>
<script src="js/data/05-roadmap.js"></script>
<script src="js/data/06-dev-foundations.js"></script>
<script src="js/data/07-dev-stack.js"></script>
<script src="js/data/08-dev-advanced.js"></script>
<script src="js/data/glossary.js"></script>
<script src="js/app.js"></script>

</html>
